<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sensussoft Careers — Apply</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 40px 48px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }

    .card-header { text-align: center; margin-bottom: 32px; }
    .card-header .icon { font-size: 40px; margin-bottom: 10px; }
    .card-header h1 { font-size: 26px; font-weight: 700; color: #1a1a2e; margin-bottom: 6px; }
    .card-header p { font-size: 14px; color: #888; }

    .form-group { margin-bottom: 20px; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #444;
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e8e8e8;
      border-radius: 10px;
      font-size: 15px;
      color: #333;
      background: #fafafa;
      transition: border-color 0.25s, box-shadow 0.25s;
      outline: none;
      font-family: inherit;
    }

    input:focus, select:focus {
      border-color: #667eea;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(102,126,234,0.12);
    }

    input::placeholder { color: #bbb; }

    /* CV Upload */
    .upload-box {
      border: 2px dashed #d1d5db;
      border-radius: 10px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      background: #fafafa;
      transition: border-color 0.25s, background 0.25s;
    }
    .upload-box:hover { border-color: #667eea; background: #f0f0ff; }
    .upload-box.has-file { border-color: #2D5A1A; background: #E2EFDA; }
    .upload-box .icon { font-size: 28px; margin-bottom: 6px; }
    .upload-box .text { font-size: 14px; color: #555; font-weight: 500; margin-bottom: 4px; }
    .upload-box .hint { font-size: 12px; color: #aaa; }
    .upload-box.has-file .text { color: #2D5A1A; }
    .upload-box input { display: none; }

    /* Submit */
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s, transform 0.15s;
    }
    .submit-btn:hover { opacity: 0.92; transform: translateY(-1px); }
    .submit-btn:active { transform: translateY(0); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* Status */
    #status {
      margin-top: 18px;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
      display: none;
    }
    #status.ok  { background: #E2EFDA; color: #2D5A1A; display: block; }
    #status.err { background: #FCE4E4; color: #8B1A1A; display: block; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      color: white;
      font-size: 11px;
      margin-left: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }
    .badge-cat  { background: #e91e8c; }
    .badge-lvl  { background: #374151; }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <div class="icon">🤖</div>
      <h1>Apply at Sensussoft</h1>
      <p>Upload your CV and pick a role. Our AI reads your resume and designs a task for you.</p>
    </div>

    <div class="form-group">
      <label>Full Name</label>
      <input id="name" type="text" placeholder="e.g. Priya Sharma">
    </div>

    <div class="form-group">
      <label>Email Address</label>
      <input id="email" type="email" placeholder="you@gmail.com">
    </div>

    <div class="form-group">
      <label>Role Applied For</label>
      <select id="role">
        <option>Junior React Developer</option>
        <option>Mid-level Node.js Developer</option>
        <option>Senior React Developer</option>
        <option>Senior Node.js Developer</option>
        <option>Mobile App Developer (Flutter)</option>
        <option>UI/UX Designer</option>
        <option>Senior UI/UX Designer</option>
        <option>QA Automation Engineer</option>
        <option>DevOps Engineer</option>
        <option>Product Manager</option>
      </select>
    </div>

    <div class="form-group">
      <label>Upload Your CV (PDF or DOCX, max 5 MB)</label>
      <label for="cv" class="upload-box" id="uploadBox">
        <div class="icon">📄</div>
        <div class="text" id="uploadLabel">Click to choose your CV file</div>
        <div class="hint">PDF or DOCX • Max 5MB</div>
        <input id="cv" type="file" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
      </label>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="submitForm()">
      🚀 Submit Application
    </button>

    <div id="status"></div>
  </div>

  <script>
    // File selection handler
    document.getElementById('cv').addEventListener('change', e => {
      const f     = e.target.files[0];
      const box   = document.getElementById('uploadBox');
      const label = document.getElementById('uploadLabel');
      if (f) {
        box.classList.add('has-file');
        label.textContent = '✅ ' + f.name + ' (' + Math.round(f.size / 1024) + ' KB)';
      } else {
        box.classList.remove('has-file');
        label.textContent = 'Click to choose your CV file';
      }
    });

    // Drag & drop
    const box = document.getElementById('uploadBox');
    box.addEventListener('dragover', e => { e.preventDefault(); box.style.borderColor = '#667eea'; });
    box.addEventListener('dragleave', () => { box.style.borderColor = ''; });
    box.addEventListener('drop', e => {
      e.preventDefault();
      box.style.borderColor = '';
      const file = e.dataTransfer.files[0];
      if (file) {
        const dt = new DataTransfer();
        dt.items.add(file);
        document.getElementById('cv').files = dt.files;
        document.getElementById('cv').dispatchEvent(new Event('change'));
      }
    });

    async function submitForm() {
      const btn    = document.getElementById('submitBtn');
      const status = document.getElementById('status');

      btn.disabled    = true;
      btn.textContent = '⏳ Reading CV and generating task...';
      status.className = '';
      status.textContent = '';

      try {
        const formData = new FormData();
        formData.append('full_name', document.getElementById('name').value);
        formData.append('email',     document.getElementById('email').value);
        formData.append('role',      document.getElementById('role').value);

        const cvFile = document.getElementById('cv').files[0];
        if (cvFile) formData.append('cv', cvFile);

        const r = await fetch('/api/career-apply', {
          method: 'POST',
          body:   formData
        });

        const data = await r.json();

        if (data.ok || data.accepted) {
          status.className = 'ok';
          status.innerHTML =
            '<b>✅ Application received!</b><br>' +
            'Task: <i>' + data.task_title + '</i>' +
            '<span class="badge badge-cat">' + (data.category || '') + '</span>' +
            '<span class="badge badge-lvl">' + (data.seniority || '') + '</span>' +
            '<br>Check your email in a few seconds.';
        } else {
          status.className = 'err';
          status.textContent = 'Error: ' + (data.error || 'unknown');
        }

      } catch (e) {
        status.className = 'err';
        status.textContent = 'Could not reach the server. Is it running?';
      } finally {
        btn.disabled    = false;
        btn.textContent = '🚀 Submit Application';
      }
    }
  </script>

</body>
</html>
